# mypy over the repository's Python, strict.  Run by rules_venv's py_mypy_aspect on every build
# (.bazelrc; the toolchain in tools/convert/3rdparty names this file), and by hand with
# `mypy tools/convert` from a checkout whose MYPYPATH holds the third-party packages.
[mypy]
python_version = 3.14
strict = true
warn_unreachable = true
pretty = true
namespace_packages = true
explicit_package_bases = true
# Errors in the listed files only; imported code is followed for its types.
follow_imports = silent
