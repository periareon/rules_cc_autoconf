name: CI

on:
  push:
    branches:
      - main
  merge_group:
  pull_request:
    types:
      - opened
      - synchronize

env:
  BAZEL_STARTUP_FLAGS: --bazelrc=${{ github.workspace }}/.github/github.bazelrc

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned: SDK changes invalidate the macOS reference snapshots.
          - os: macos-26
          - os: ubuntu-24.04
          - os: ubuntu-24.04-arm
          - os: windows-2022
    steps:
      # Checkout the code
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - uses: ./.github/actions/buildbuddy
        with:
          api_key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - name: Setup Bazelrc (Windows)
        run: |
          echo "TEMP=$env:RUNNER_TEMP" >> "$env:GITHUB_ENV"
          echo "TMP=$env:RUNNER_TEMP" >> "$env:GITHUB_ENV"
          echo "startup --output_user_root=D:/bzl" > ./user.bazelrc
        if: startswith(runner.os, 'Windows')
      - name: Setup Bazelrc
        run: |
          echo "common --keep_going" >> ./user.bazelrc

      # Build and Test the code
      - name: Test (Unix)
        run: bazel ${BAZEL_STARTUP_FLAGS[@]} test //...
        if: startswith(runner.os, 'Windows') != true
      - name: Test (Windows)
        run: bazel $env:BAZEL_STARTUP_FLAGS test //...
        if: startswith(runner.os, 'Windows')

      # Every comparison test leaves both sides, the diff, config.log and the
      # configure environment in its undeclared outputs; keep them for review.
      - name: Collect test outputs
        if: failure()
        shell: bash
        run: |
          testlogs="$(bazel ${BAZEL_STARTUP_FLAGS[@]} info bazel-testlogs)"
          mkdir -p failed-test-outputs
          find "$testlogs" -name test.xml | while read -r xml; do
            if grep -q "<failure\|<error" "$xml"; then
              dir="$(dirname "$xml")"
              rel="${dir#"$testlogs"/}"
              mkdir -p "failed-test-outputs/$rel"
              cp -R "$dir"/. "failed-test-outputs/$rel/"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-test-outputs-${{ github.job }}-${{ matrix.os }}
          path: failed-test-outputs
          if-no-files-found: ignore

  ci-path-mapping:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned: SDK changes invalidate the macOS reference snapshots.
          - os: macos-26
          - os: ubuntu-24.04
          - os: ubuntu-24.04-arm
    steps:
      # Checkout the code
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - uses: ./.github/actions/buildbuddy
        with:
          api_key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - name: Setup Bazelrc (Windows)
        run: |
          echo "TEMP=$env:RUNNER_TEMP" >> "$env:GITHUB_ENV"
          echo "TMP=$env:RUNNER_TEMP" >> "$env:GITHUB_ENV"
          echo "startup --output_user_root=D:/bzl" > ./user.bazelrc
          echo "common --experimental_output_paths=strip" >> ./user.bazelrc
        if: startswith(runner.os, 'Windows')
      - name: Setup Bazelrc
        run: |
          echo "common --keep_going" >> ./user.bazelrc
          echo "common --experimental_output_paths=strip" >> ./user.bazelrc

      # Build and Test the code
      - name: Test (Unix)
        run: bazel ${BAZEL_STARTUP_FLAGS[@]} test //...
        if: startswith(runner.os, 'Windows') != true
      - name: Test (Windows)
        run: bazel $env:BAZEL_STARTUP_FLAGS test //...
        if: startswith(runner.os, 'Windows')

      # Every comparison test leaves both sides, the diff, config.log and the
      # configure environment in its undeclared outputs; keep them for review.
      - name: Collect test outputs
        if: failure()
        shell: bash
        run: |
          testlogs="$(bazel ${BAZEL_STARTUP_FLAGS[@]} info bazel-testlogs)"
          mkdir -p failed-test-outputs
          find "$testlogs" -name test.xml | while read -r xml; do
            if grep -q "<failure\|<error" "$xml"; then
              dir="$(dirname "$xml")"
              rel="${dir#"$testlogs"/}"
              mkdir -p "failed-test-outputs/$rel"
              cp -R "$dir"/. "failed-test-outputs/$rel/"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-test-outputs-${{ github.job }}-${{ matrix.os }}
          path: failed-test-outputs
          if-no-files-found: ignore

  ci-integration-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2022
        test:
          - name: simple
            path: examples/simple
            expect_pass: true
          - name: negative_compute_int
            path: autoconf/tests/integration/negative_compute_int
            expect_pass: false
          - name: gnulib_integrations
            path: gnulib/tests/integration
            expect_pass: true
    name: "integration-${{ matrix.test.name }} (${{ matrix.os }})"
    steps:
      # Checkout the code
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - uses: ./.github/actions/buildbuddy
        with:
          api_key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - name: Setup Bazelrc (Windows)
        working-directory: "${{ github.workspace }}/${{ matrix.test.path }}"
        run: |
          echo "TEMP=$env:RUNNER_TEMP" >> "$env:GITHUB_ENV"
          echo "TMP=$env:RUNNER_TEMP" >> "$env:GITHUB_ENV"
          echo "startup --output_user_root=D:/bzl" > ./user.bazelrc
        if: startswith(runner.os, 'Windows')
      - name: Setup Bazelrc
        working-directory: "${{ github.workspace }}/${{ matrix.test.path }}"
        run: |
          echo "common --keep_going" >> ./user.bazelrc

      # Build and Test the code
      - name: Test (Unix)
        working-directory: "${{ github.workspace }}/${{ matrix.test.path }}"
        run: |
          bazel ${BAZEL_STARTUP_FLAGS[@]} test //... && result=0 || result=$?
          if [ "${{ matrix.test.expect_pass }}" = "true" ]; then
            exit $result
          else
            [ $result -ne 0 ]
          fi
        if: startswith(runner.os, 'Windows') != true
      - name: Test (Windows)
        working-directory: "${{ github.workspace }}/${{ matrix.test.path }}"
        run: |
          bazel $env:BAZEL_STARTUP_FLAGS test //...
          if ("${{ matrix.test.expect_pass }}" -eq "true") {
            exit $LASTEXITCODE
          } else {
            if ($LASTEXITCODE -eq 0) { exit 1 } else { exit 0 }
          }
        if: startswith(runner.os, 'Windows')

  ci-format:
    runs-on: ubuntu-24.04
    steps:
      # Checkout the code
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Buildifier
        run: |
          wget "https://github.com/bazelbuild/buildtools/releases/download/v${BUILDIFIER_VERSION}/buildifier-linux-amd64" -O buildifier
          chmod +x ./buildifier
          ./buildifier -lint=warn -mode=check -warnings=all -r ${{ github.workspace }}
          rm ./buildifier
        env:
          BUILDIFIER_VERSION: 8.2.0
      - uses: DoozyX/clang-format-lint-action@v0.14
        with:
          source: '.'
          extensions: 'h,c,cc'
          clangFormatVersion: 14
