name: CI

on:
  push:
    branches:
      - main
  merge_group:
  pull_request:
    types:
      - opened
      - synchronize

env:
  BAZEL_STARTUP_FLAGS: --bazelrc=${{ github.workspace }}/.github/github.bazelrc

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-24.04
          - os: ubuntu-24.04-arm
          - os: windows-2022
    steps:
      # Checkout the code
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Setup Bazelrc (Windows)
        run: |
          echo "TEMP=$env:RUNNER_TEMP" >> "$env:GITHUB_ENV"
          echo "TMP=$env:RUNNER_TEMP" >> "$env:GITHUB_ENV"
          echo "startup --output_user_root=D:/bzl" > ./user.bazelrc
        if: startswith(runner.os, 'Windows')
      - name: Setup Bazelrc
        run: |
          echo "common --keep_going" >> ./user.bazelrc

      - name: Install Autoconf (Unix)
        run: |
          ./tools/test_deps/install_test_deps.sh
        if: startswith(runner.os, 'Windows') != true
      - name: Install Autoconf (Windows)
        run: |
          echo NOOP
        if: startswith(runner.os, 'Windows')

      # Build and Test the code
      - name: Test (Unix)
        run: bazel ${BAZEL_STARTUP_FLAGS[@]} test //...
        if: startswith(runner.os, 'Windows') != true
      - name: Test (Windows)
        run: bazel $env:BAZEL_STARTUP_FLAGS test //...
        if: startswith(runner.os, 'Windows')

  ci-path-mapping:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-24.04
          - os: ubuntu-24.04-arm
    steps:
      # Checkout the code
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Setup Bazelrc (Windows)
        run: |
          echo "TEMP=$env:RUNNER_TEMP" >> "$env:GITHUB_ENV"
          echo "TMP=$env:RUNNER_TEMP" >> "$env:GITHUB_ENV"
          echo "startup --output_user_root=D:/bzl" > ./user.bazelrc
          echo "common --experimental_output_paths=strip" >> ./user.bazelrc
        if: startswith(runner.os, 'Windows')
      - name: Setup Bazelrc
        run: |
          echo "common --keep_going" >> ./user.bazelrc
          echo "common --experimental_output_paths=strip" >> ./user.bazelrc

      - name: Install Autoconf (Unix)
        run: |
          ./tools/test_deps/install_test_deps.sh
        if: startswith(runner.os, 'Windows') != true
      - name: Install Autoconf (Windows)
        run: |
          echo NOOP
        if: startswith(runner.os, 'Windows')

      # Build and Test the code
      - name: Test (Unix)
        run: bazel ${BAZEL_STARTUP_FLAGS[@]} test //...
        if: startswith(runner.os, 'Windows') != true
      - name: Test (Windows)
        run: bazel $env:BAZEL_STARTUP_FLAGS test //...
        if: startswith(runner.os, 'Windows')

  ci-integration-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2022
        test:
          - name: simple
            path: examples/simple
            expect_pass: true
          - name: negative_compute_int
            path: autoconf/tests/integration/negative_compute_int
            expect_pass: false
          - name: gnulib_integrations
            path: gnulib/tests/integration
            expect_pass: true
    name: "integration-${{ matrix.test.name }} (${{ matrix.os }})"
    steps:
      # Checkout the code
      - uses: actions/checkout@v4

      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Setup Bazelrc (Windows)
        working-directory: "${{ github.workspace }}/${{ matrix.test.path }}"
        run: |
          echo "TEMP=$env:RUNNER_TEMP" >> "$env:GITHUB_ENV"
          echo "TMP=$env:RUNNER_TEMP" >> "$env:GITHUB_ENV"
          echo "startup --output_user_root=D:/bzl" > ./user.bazelrc
        if: startswith(runner.os, 'Windows')
      - name: Setup Bazelrc
        working-directory: "${{ github.workspace }}/${{ matrix.test.path }}"
        run: |
          echo "common --keep_going" >> ./user.bazelrc

      # Build and Test the code
      - name: Test (Unix)
        working-directory: "${{ github.workspace }}/${{ matrix.test.path }}"
        run: |
          bazel ${BAZEL_STARTUP_FLAGS[@]} test //... && result=0 || result=$?
          if [ "${{ matrix.test.expect_pass }}" = "true" ]; then
            exit $result
          else
            [ $result -ne 0 ]
          fi
        if: startswith(runner.os, 'Windows') != true
      - name: Test (Windows)
        working-directory: "${{ github.workspace }}/${{ matrix.test.path }}"
        run: |
          bazel $env:BAZEL_STARTUP_FLAGS test //...
          if ("${{ matrix.test.expect_pass }}" -eq "true") {
            exit $LASTEXITCODE
          } else {
            if ($LASTEXITCODE -eq 0) { exit 1 } else { exit 0 }
          }
        if: startswith(runner.os, 'Windows')

  ci-integration-tests-musl:
    # musl libc coverage for the gnulib integration tests. GitHub doesn't
    # offer Alpine/musl hosted runners, so we run the test inside an
    # Alpine container on a glibc Ubuntu runner. The container image
    # (`node:20-alpine`) ships node 20, which is required for GitHub
    # Actions to execute JS-based actions (actions/checkout, etc.); all
    # other deps are installed via `apk`.
    #
    # Why this matters: gnulib has many gl_cv_* probes whose results
    # legitimately differ between glibc and musl (e.g. _GNU_SOURCE
    # availability, behavior of edge-case POSIX functions). Without a
    # musl runner, a port that compiles on Ubuntu can silently break for
    # downstream consumers building on Alpine.
    runs-on: ubuntu-24.04
    container:
      image: node:20-alpine
    name: "integration-gnulib_integrations (alpine-musl)"
    steps:
      - name: Install Alpine packages
        # bash so subsequent steps can use `shell: bash`. build-base
        # pulls gcc + musl-dev. openjdk needed by Bazel. autoconf et al
        # match the install_test_deps.sh contract used on Ubuntu/macOS.
        run: |
          apk add --no-cache \
            bash curl wget git \
            build-base linux-headers \
            python3 \
            openjdk21-jre-headless \
            autoconf automake libtool m4 \
            ca-certificates

      - uses: actions/checkout@v4

      - name: Install Bazelisk
        # ubuntu-24.04 hosted runners are x86_64-only — no arch detection needed.
        shell: bash
        run: |
          wget -q "https://github.com/bazelbuild/bazelisk/releases/download/v1.20.0/bazelisk-linux-amd64" \
            -O /usr/local/bin/bazel
          chmod +x /usr/local/bin/bazel

      - name: Test
        shell: bash
        working-directory: "${{ github.workspace }}/gnulib/tests/integration"
        run: |
          echo "common --keep_going" >> ./user.bazelrc
          bazel ${BAZEL_STARTUP_FLAGS} test //...

  ci-format:
    runs-on: ubuntu-24.04
    steps:
      # Checkout the code
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Buildifier
        run: |
          wget "https://github.com/bazelbuild/buildtools/releases/download/v${BUILDIFIER_VERSION}/buildifier-linux-amd64" -O buildifier
          chmod +x ./buildifier
          ./buildifier -lint=warn -mode=check -warnings=all -r ${{ github.workspace }}
          rm ./buildifier
        env:
          BUILDIFIER_VERSION: 8.2.0
      - uses: DoozyX/clang-format-lint-action@v0.14
        with:
          source: '.'
          extensions: 'h,c,cc'
          clangFormatVersion: 14
